name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['main']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Pruebas de la API y migraciones
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis@sha256:94146ac37bc61e2322f88016056c5920729cb8c64c8542ed590af8fc2abdac07
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 55434:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: python -m pip install -r requirements-dev.txt
      - name: Migraciones y pruebas
        env:
          BIRDNET_TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:55434/birdnet_s4_test
        run: |
          python tests/prepare_database.py
          python -m pytest -q
