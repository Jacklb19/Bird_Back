name: Keep the database active

# Free Supabase projects can pause after inactivity (risk R-09). Read a few public species cards daily without
# credentials; a failed database request makes this workflow fail and notifies its maintainer.

on:
  schedule:
    - cron: '17 11 * * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    name: Lightweight database reads
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      API_URL: https://bird-back.vercel.app
    steps:
      - name: Read species cards from the API
        run: |
          for species in Turdus%20fuscater Zonotrichia%20capensis Colibri%20coruscans; do
            status=$(curl --silent --output /dev/null --write-out '%{http_code}' --retry 3 --retry-delay 10 "$API_URL/v1/species/$species/card?locale=es")
            echo "$species: $status"
            # Both a saved card (200) and a missing one (404) prove database access; a paused database returns 503.
            case "$status" in 200|404) ;; *) exit 1 ;; esac
          done
